openapi: 3.0.0
info:
  title: Fuego XFG API Gateway
  version: 1.0.0
  description: External REST API surface for Fuego (XFG) network and Hearth Exchange.
servers:
  - url: http://localhost:8787/v1
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    AtomicAmount:
      type: string
      pattern: '^[0-9]+$'
      description: >-
        Unsigned decimal string of atomic units. Never a JSON number: XFG and HEAT
        amounts exceed 2^53-1, which a JavaScript JSON parser rounds.
      example: '9007199254740993'
    PublicAuditBalances:
      type: object
      required:
        - snapshot_height
        - snapshot_block_hash
        - xfg_removed_from_circulation_total
        - eternal_flame_burn_total_xfg
        - swf_xfg_permanently_retired_total
        - treasury_accounts
        - cd_yield_accounting
        - hearth_pool
        - swf_accounts
        - status
      properties:
        snapshot_height:
          type: integer
          format: int32
          description: Zero-based height of the block at snapshot_block_hash.
        snapshot_block_hash:
          type: string
          description: Hash of the block at snapshot_height.
        xfg_removed_from_circulation_total:
          allOf:
            - $ref: '#/components/schemas/AtomicAmount'
          description: >-
            Total XFG removed from circulation — every XFG atom that has left
            spendable circulation, including Eternal Flame burns, fee
            conversions, and XFG held as pending SWF collateral. Not a
            total-supply reduction and not a total-destruction figure.
        eternal_flame_burn_total_xfg:
          allOf:
            - $ref: '#/components/schemas/AtomicAmount'
          description: Cumulative Eternal Flame burn (the EF routing share of burns).
        swf_xfg_permanently_retired_total:
          allOf:
            - $ref: '#/components/schemas/AtomicAmount'
          description: SWF XFG permanently retired from total supply.
        note_xfg_removed_from_circulation:
          type: string
          description: Label and scope note for the aggregate above.
        note_reconciliation:
          type: string
          description: >-
            States that the lifecycle amounts are independently sourced and are
            not guaranteed to reconcile with the aggregate, and that counters are
            never summed with the vault balances that back them.
        treasury_accounts:
          type: object
          properties:
            legacy_counter_xfg:
              allOf:
                - $ref: '#/components/schemas/AtomicAmount'
              description: Deprecated legacy counter. Not the protocol's current holdings.
            pending_xfg:
              allOf:
                - $ref: '#/components/schemas/AtomicAmount'
              description: Unconverted treasury fee share; the LP pairing source.
            heat_reserve:
              allOf:
                - $ref: '#/components/schemas/AtomicAmount'
              description: HEAT leg of the treasury LP position.
            bonus_vault_counter_heat:
              allOf:
                - $ref: '#/components/schemas/AtomicAmount'
              description: Bonus vault counter, HEAT atomics.
            vault_general_xfg:
              allOf:
                - $ref: '#/components/schemas/AtomicAmount'
              description: GENERAL_RESERVE partition UTXO balance, XFG atomics.
            vault_general_heat:
              allOf:
                - $ref: '#/components/schemas/AtomicAmount'
              description: GENERAL_RESERVE partition UTXO balance, HEAT atomics.
            vault_lp_reserve_xfg:
              allOf:
                - $ref: '#/components/schemas/AtomicAmount'
              description: LP_RESERVE partition UTXO balance, XFG atomics.
            vault_lp_reserve_heat:
              allOf:
                - $ref: '#/components/schemas/AtomicAmount'
              description: LP_RESERVE partition UTXO balance, HEAT atomics.
        cd_yield_accounting:
          type: object
          properties:
            pending_xfg:
              allOf:
                - $ref: '#/components/schemas/AtomicAmount'
              description: Accrued fee value still denominated in XFG, not yet converted.
            claims_counter_heat:
              allOf:
                - $ref: '#/components/schemas/AtomicAmount'
              description: CD yield claims counter, HEAT atomics.
            apy_pool_vault_heat:
              allOf:
                - $ref: '#/components/schemas/AtomicAmount'
              description: CD_APY_POOL partition UTXO balance backing the counter, HEAT atomics.
            base_claim_cap_heat:
              allOf:
                - $ref: '#/components/schemas/AtomicAmount'
              description: >-
                Effective cap on a base claim: min(claims_counter_heat,
                apy_pool_vault_heat), matching what consensus accepts.
        hearth_pool:
          type: object
          properties:
            pool_reserve_xfg:
              allOf:
                - $ref: '#/components/schemas/AtomicAmount'
              description: Whole shared Hearth pool XFG reserve, not the protocol's share.
            pool_reserve_heat:
              allOf:
                - $ref: '#/components/schemas/AtomicAmount'
              description: Whole shared Hearth pool HEAT reserve.
            pool_total_lp_shares:
              allOf:
                - $ref: '#/components/schemas/AtomicAmount'
              description: Total LP shares outstanding for the shared pool.
            protocol_lp_shares:
              allOf:
                - $ref: '#/components/schemas/AtomicAmount'
              description: The protocol's LP shares in that pool.
            protocol_lp_value_xfg:
              allOf:
                - $ref: '#/components/schemas/AtomicAmount'
              description: Pro-rata XFG value of protocol_lp_shares.
            protocol_lp_value_heat:
              allOf:
                - $ref: '#/components/schemas/AtomicAmount'
              description: Pro-rata HEAT value of protocol_lp_shares.
        swf_accounts:
          type: object
          properties:
            collateral_pending_xfg:
              allOf:
                - $ref: '#/components/schemas/AtomicAmount'
              description: >-
                SWF XFG that has left circulation but is still in total supply.
                Not a burn and not permanently retired.
            heat_counter:
              allOf:
                - $ref: '#/components/schemas/AtomicAmount'
              description: SWF HEAT collateral counter. Separate from SWF vault UTXOs.
            vault_swf_xfg:
              allOf:
                - $ref: '#/components/schemas/AtomicAmount'
              description: SWF partition UTXO balance, XFG atomics.
            vault_swf_heat:
              allOf:
                - $ref: '#/components/schemas/AtomicAmount'
              description: SWF partition UTXO balance, HEAT atomics.
        status:
          type: string
          example: OK
security:
  - ApiKeyAuth: []

paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: OK
  /node/info:
    get:
      summary: Get core daemon info
      security: []
      responses:
        '200':
          description: OK
  /node/height:
    get:
      summary: Get network height
      security: []
      responses:
        '200':
          description: OK
  /node/block/{hash}:
    get:
      summary: Get block by hash
      security: []
      parameters:
        - in: path
          name: hash
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /node/audit/balances:
    get:
      summary: Get the public audit accounting snapshot
      description: >-
        One read-only snapshot of XFG removed from circulation and its
        components, protocol treasury custody, CD yield backing, protocol-owned
        Hearth liquidity, and SWF balances, all read from a single chain tip.
        Counters and the vault UTXO balances that back them are reported
        separately and are never summed; there is no combined XFG+HEAT treasury
        total. Every monetary value is a decimal string of atomic units.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAuditBalances'
  /hearth/pool:
    get:
      summary: Get Hearth AMM pool info
      security: []
      responses:
        '200':
          description: OK
  /hearth/quote:
    get:
      summary: Get Hearth swap quote
      security: []
      parameters:
        - in: query
          name: amount
          schema:
            type: integer
        - in: query
          name: from_asset
          schema:
            type: string
      responses:
        '200':
          description: OK
  /hearth/orderbook:
    get:
      summary: Get Hearth aggregated limit orderbook
      security: []
      parameters:
        - in: query
          name: active_only
          schema:
            type: boolean
      responses:
        '200':
          description: OK
  /hearth/ohlcv:
    get:
      summary: Get Hearth OHLCV price history
      security: []
      parameters:
        - in: query
          name: period
          schema:
            type: integer
            default: 300
        - in: query
          name: count
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: OK
  /hearth/swap:
    post:
      summary: Execute an AMM swap
      responses:
        '200':
          description: OK
  /hearth/order/place:
    post:
      summary: Place a limit order
      responses:
        '200':
          description: OK
  /hearth/order/cancel:
    post:
      summary: Cancel a limit order
      responses:
        '200':
          description: OK
  /wallet/balance:
    get:
      summary: Get wallet balance
      responses:
        '200':
          description: OK
  /wallet/cds:
    get:
      summary: Get wallet Certificates of Deposit
      responses:
        '200':
          description: OK
